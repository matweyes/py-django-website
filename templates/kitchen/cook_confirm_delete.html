{% extends "base.html" %}

{% block title %}Kitchen Service - Delete Cook{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-6">
            <div class="card card-outline card-danger">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-trash"></i> Delete Cook</h3>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to delete cook <strong>{{ object.username }}</strong>?</p>
                    <form action="" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Yes, delete
                        </button>
                        <a href="{% url 'kitchen:cook-list' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
